name: CI

# Push to main and pull requests targeting it. Not every branch: that would run
# each change twice and answer no question the pull request has not already.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this the first failure cancels the rest, so a Windows failure
      # would hide whether macOS also failed. The point of the matrix is to
      # learn about every platform in one run.
      fail-fast: false
      matrix:
        include:
          # Node 24 across all three platforms: the unknown is the platform,
          # not the minor version.
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
          # The declared engines floor. A floor nobody tests is a wish.
          - os: ubuntu-latest
            node: 22
          # The next Current. Finding out it broke should not wait for a user.
          - os: ubuntu-latest
            node: 26

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins and fails if package.json and the lockfile disagree,
      # which is the behaviour wanted on a build machine.
      - run: npm ci

      - run: npm test
      - run: npm run typecheck
      - run: npm run build
